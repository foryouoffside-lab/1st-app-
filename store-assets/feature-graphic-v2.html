<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px; height: 500px;
    background: #050508; overflow: hidden;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1024px; height: 500px; background: #050508; }

  /* Same faint grid the app itself uses as its ground. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.030) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.030) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  /* Two soft glows in the app's violet/blue, kept away from the centre so the
     Play Store's own play-button overlay never lands on a bright patch. */
  .glowA { position:absolute; inset:0;
    background: radial-gradient(ellipse 660px 480px at 18% 48%, rgba(139,92,246,0.36), transparent 66%); }
  .glowB { position:absolute; inset:0;
    background: radial-gradient(ellipse 560px 400px at 96% 88%, rgba(37,99,235,0.22), transparent 62%); }

  /* Play crops feature graphics differently across surfaces, so everything
     that carries meaning sits inside a generous safe area. */
  .content {
    position: relative; height: 100%;
    display: flex; align-items: center; gap: 50px;
    padding: 0 62px;
  }

  .markWrap { position: relative; flex: 0 0 auto; }
  .markGlow {
    position: absolute; inset: -26px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.50), transparent 68%);
    filter: blur(14px);
  }
  .mark {
    position: relative; width: 202px; height: 202px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    box-shadow: 0 18px 48px rgba(88,28,190,0.55), inset 0 2px 0 rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
  }

  .copy { min-width: 0; }

  .name {
    font-size: 80px; font-weight: 800; letter-spacing: -2px;
    color: #fff; line-height: 1;
    text-shadow: 0 3px 22px rgba(0,0,0,0.55);
  }
  .tag {
    margin-top: 18px;
    font-size: 33px; font-weight: 650; line-height: 1.3;
    color: #c9c7d4; letter-spacing: -0.2px;
  }
  .tag b { color: #fff; font-weight: 800; }

  .pills { margin-top: 30px; display: flex; gap: 12px; }
  .pill {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 19px; border-radius: 999px;
    background: rgba(139,92,246,0.13);
    border: 1px solid rgba(139,92,246,0.34);
    color: #d6ccff; font-size: 18px; font-weight: 750;
    white-space: nowrap;
  }
  .pill svg { display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="glowA"></div>
  <div class="glowB"></div>

  <div class="content">
    <div class="markWrap">
      <div class="markGlow"></div>
      <div class="mark">
        <!-- The app's own reticle mark, drawn as vector so it stays crisp. -->
        <svg width="202" height="202" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="22" stroke="#fff" stroke-width="3" opacity=".92"/>
          <circle cx="50" cy="50" r="14" stroke="#fff" stroke-width="2" opacity=".8"/>
          <circle cx="50" cy="50" r="6"  fill="#fff" opacity=".95"/>
          <line x1="50" y1="18" x2="50" y2="32" stroke="#fff" stroke-width="2.6" opacity=".92"/>
          <line x1="50" y1="68" x2="50" y2="82" stroke="#fff" stroke-width="2.6" opacity=".92"/>
          <line x1="18" y1="50" x2="32" y2="50" stroke="#fff" stroke-width="2.6" opacity=".92"/>
          <line x1="68" y1="50" x2="82" y2="50" stroke="#fff" stroke-width="2.6" opacity=".92"/>
          <line x1="30" y1="30" x2="38" y2="38" stroke="#fff" stroke-width="2" opacity=".6"/>
          <line x1="70" y1="30" x2="62" y2="38" stroke="#fff" stroke-width="2" opacity=".6"/>
          <line x1="30" y1="70" x2="38" y2="62" stroke="#fff" stroke-width="2" opacity=".6"/>
          <line x1="70" y1="70" x2="62" y2="62" stroke="#fff" stroke-width="2" opacity=".6"/>
        </svg>
      </div>
    </div>

    <div class="copy">
      <!-- No "PRO" lockup any more: the app was renamed and the badge was the
           last place still claiming it, which contradicted both the launcher
           label and the store listing title. -->
      <div class="name">SkillDrills</div>

      <!-- "brain training" is gone too. The listing copy was deliberately
           rewritten to drop efficacy claims (see LAUNCH_COMPLIANCE.md §4) and
           the graphic has to say the same thing the description does: what the
           drills ARE, not what they will do to you. -->
      <div class="tag">
        <b>24 free drills</b> for focus, memory<br>
        and <b>reaction speed</b>.
      </div>

      <div class="pills">
        <div class="pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#c4b5fd"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
          Real-time 1v1 Arena
        </div>
        <div class="pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
          Daily Challenges
        </div>
        <div class="pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-7"/><path d="M17 8h4v4"/></svg>
          Track Progress
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
