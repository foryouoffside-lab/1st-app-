<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    background: #050508;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1024px;
    height: 500px;
    background: #050508;
  }
  /* faint grid, matching the app's own background pattern */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* soft violet glow, matching AuthGate's radial glow */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 700px 500px at 22% 50%, rgba(139,92,246,0.30), transparent 65%);
  }
  .glow2 {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 600px 420px at 100% 100%, rgba(37,99,235,0.20), transparent 60%);
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 52px;
    gap: 44px;
  }
  .logo-wrap {
    flex-shrink: 0;
    width: 200px;
    height: 200px;
    filter: drop-shadow(0 0 40px rgba(124,58,237,0.45));
  }
  .text-col {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .wordmark {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .wordmark .name {
    font-size: 64px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .wordmark .pro {
    font-size: 20px;
    font-weight: 800;
    color: #c4b5fd;
    background: rgba(139,92,246,0.14);
    border: 1px solid rgba(139,92,246,0.35);
    padding: 6px 16px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .tagline {
    font-size: 27px;
    font-weight: 600;
    color: #cbd5e1;
    max-width: 620px;
    line-height: 1.35;
  }
  .tagline b {
    color: #ffffff;
    font-weight: 800;
  }
  .chips {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .chip {
    font-size: 14px;
    font-weight: 700;
    color: #a78bfa;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="content">
      <div class="logo-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="url(#grad2)" stroke-width="2"/>
          <circle cx="50" cy="50" r="22" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
          <circle cx="50" cy="50" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
          <circle cx="50" cy="50" r="6" fill="white" opacity="0.9"/>
          <line x1="50" y1="18" x2="50" y2="32" stroke="white" stroke-width="2.5" opacity="0.9"/>
          <line x1="50" y1="68" x2="50" y2="82" stroke="white" stroke-width="2.5" opacity="0.9"/>
          <line x1="18" y1="50" x2="32" y2="50" stroke="white" stroke-width="2.5" opacity="0.9"/>
          <line x1="68" y1="50" x2="82" y2="50" stroke="white" stroke-width="2.5" opacity="0.9"/>
          <line x1="30" y1="30" x2="38" y2="38" stroke="white" stroke-width="2" opacity="0.6"/>
          <line x1="70" y1="30" x2="62" y2="38" stroke="white" stroke-width="2" opacity="0.6"/>
          <line x1="30" y1="70" x2="38" y2="62" stroke="white" stroke-width="2" opacity="0.6"/>
          <line x1="70" y1="70" x2="62" y2="62" stroke="white" stroke-width="2" opacity="0.6"/>
          <circle cx="50" cy="50" r="2.5" fill="white"/>
        </svg>
      </div>
      <div class="text-col">
        <div class="wordmark">
          <span class="name">SkillDrills</span>
          <span class="pro">Pro</span>
        </div>
        <div class="tagline">Train <b>focus</b>, <b>memory</b> &amp; <b>reaction time</b><br>with 24 free brain training drills.</div>
        <div class="chips">
          <span class="chip">⚡ Real-time 1v1 Arena</span>
          <span class="chip">📅 Daily Challenges</span>
          <span class="chip">📈 Track Your Progress</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
