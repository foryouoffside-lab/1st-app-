<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0f1117;font-family:Segoe UI,Arial;color:#e5e7eb;padding:28px}
.row{display:flex;gap:40px}.col{text-align:center}
.big{width:300px;height:300px;border-radius:26%;overflow:hidden;display:block}
.small{display:flex;gap:18px;justify-content:center;margin-top:18px;align-items:end}
.small img{border-radius:50%}.small .sq{border-radius:24%}
h2{margin:14px 0 2px;font-size:22px}p{margin:0;color:#9ca3af;font-size:14px}
.home{background:#1f2937;padding:10px 0 6px;border-radius:12px;margin-top:14px}
.home span{display:block;font-size:13px;margin-top:4px}
</style></head><body><div class="row">
<div class="col"><img class="big" src="icon-a.svg"><h2>A · Spark in the Lock</h2><p>dark, your app's corner brackets + a struck spark</p>
<div class="small"><img src="icon-a.svg" width="96"><img class="sq" src="icon-a.svg" width="64"><img src="icon-a.svg" width="40"></div>
<div class="home"><img src="icon-a.svg" width="56" style="border-radius:50%"><span>Flint</span></div></div>
<div class="col"><img class="big" src="icon-b.svg"><h2>B · F + spark</h2><p>the name's letter, with a spark struck off it</p>
<div class="small"><img src="icon-b.svg" width="96"><img class="sq" src="icon-b.svg" width="64"><img src="icon-b.svg" width="40"></div>
<div class="home"><img src="icon-b.svg" width="56" style="border-radius:50%"><span>Flint</span></div></div>
<div class="col"><img class="big" src="icon-c.svg"><h2>C · Evolved target</h2><p>today's icon, centre dot becomes a spark</p>
<div class="small"><img src="icon-c.svg" width="96"><img class="sq" src="icon-c.svg" width="64"><img src="icon-c.svg" width="40"></div>
<div class="home"><img src="icon-c.svg" width="56" style="border-radius:50%"><span>Flint</span></div></div>
</div></body></html>
